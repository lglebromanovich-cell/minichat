name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project
        run: flutter create --platforms=android minichat_app
      - name: Copy app code
        run: cp lib/main.dart minichat_app/lib/main.dart
      - name: Add packages
        working-directory: minichat_app
        run: flutter pub add image_picker path_provider shared_preferences
      - name: Add INTERNET permission
        run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' minichat_app/android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: minichat_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: minichat-apk
          path: minichat_app/build/app/outputs/flutter-apk/app-release.apk
